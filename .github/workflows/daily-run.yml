name: Daily market run

on:
  schedule:
    # 21:30 UTC, Monday to Friday. That is 4:30 pm ET in winter (EST) and
    # 5:30 pm ET in summer (EDT), always after the 4:00 pm ET market close.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab (skips the holiday check)

permissions:
  contents: write         # needed to commit the updated output/ files

concurrency:
  group: daily-market-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scheduled runs only. On a day the NYSE is closed (New Year's Day, MLK Day,
      # Presidents Day, Good Friday, Memorial Day, Juneteenth, Independence Day,
      # Labor Day, Thanksgiving, Christmas) the remaining steps are skipped, so no
      # API calls are made and nothing is committed. If this check itself fails,
      # the run goes ahead, which is harmless on a holiday.
      - name: Check for market holiday
        id: gate
        if: github.event_name == 'schedule'
        run: |
          python -m pip install holidays || true
          skip=false
          name=$(python - <<'PY' 2>/dev/null
          import datetime as dt
          import holidays
          from zoneinfo import ZoneInfo
          today = dt.datetime.now(ZoneInfo("America/New_York")).date()
          print(holidays.financial_holidays("NYSE", years=today.year).get(today) or "")
          PY
          ) || name=""
          if [ -n "$name" ]; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Market status today: ${name:-regular trading day} (skip=$skip)"

      - name: Install packages
        if: steps.gate.outputs.skip != 'true'
        run: python -m pip install numpy pandas matplotlib requests scipy scikit-learn

      - name: Run analysis on today's closing prices
        if: steps.gate.outputs.skip != 'true'
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python market_analysis.py

      - name: Commit updated results
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "daily-run[bot]"
          git config user.email "daily-run@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git push
          fi
