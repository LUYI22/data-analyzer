name: Daily market run

on:
  schedule:
    # 21:30 UTC, Monday to Friday. That is 4:30 pm ET in winter (EST) and
    # 5:30 pm ET in summer (EDT), always after the 4:00 pm ET market close.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed to commit the updated output/ files

concurrency:
  group: daily-market-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: python -m pip install numpy pandas matplotlib requests scipy scikit-learn

      - name: Run analysis on today's closing prices
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python market_analysis.py

      - name: Commit updated results
        run: |
          git config user.name "daily-run[bot]"
          git config user.email "daily-run@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git push
          fi
